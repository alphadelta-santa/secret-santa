name: Send announcement

# Emails the event announcement to everyone in the ANNOUNCE_TO secret
# (email addresses separated by commas). Kept in a secret so the addresses stay private.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SEND to confirm"
        required: true

permissions:
  contents: read

jobs:
  announce:
    if: ${{ inputs.confirm == 'SEND' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Send
        working-directory: scripts
        run: node announce.mjs
        env:
          TO: ${{ secrets.ANNOUNCE_TO }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ secrets.SITE_URL }}
          TIMEZONE: America/New_York
          WISHLIST_DEADLINE: "2026-11-27"
          DEFAULT_BUDGET: "35"
          EVENT_DATE: "2026-12-11"
